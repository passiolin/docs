# 同一 MySQL 实例、两个库 -> 两个 Doris 库
# 一个 pipeline 同时读 mdb_a / mdb_b,route 把同名表隔到不同 Doris database。
source:
  type: mysql
  hostname: <MYSQL_A_IP>
  port: 3306
  username: cdc
  password: <CDC_PASSWORD>
  tables: mdb_a.\.*, mdb_b.\.*
  server-id: 5600-5604
  server-time-zone: Asia/Shanghai
  scan.binlog.newly-added-table.enabled: true
  jdbc.properties.allowPublicKeyRetrieval: true

sink:
  type: doris
  fenodes: <DORIS_FE_IP>:8030
  username: root
  password: ""
  table.create.properties.light_schema_change: true
  table.create.properties.replication_num: 3

route:
  - source-table: mdb_a.\.*
    sink-table: ods_multi_a.<>
    replace-symbol: <>
  - source-table: mdb_b.\.*
    sink-table: ods_multi_b.<>
    replace-symbol: <>

pipeline:
  name: mysql-multidb-to-doris
  parallelism: 2
  schema.change.behavior: evolve
