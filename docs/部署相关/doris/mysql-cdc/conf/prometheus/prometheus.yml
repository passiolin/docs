global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    lab: mysql-doris-cdc

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: sync-exporter
    static_configs:
      - targets: ['127.0.0.1:9273']

  - job_name: node
    static_configs:
      - targets:
          - 10.10.12.121:9100
          - 10.10.12.122:9100
          - 10.10.12.123:9100
          - 10.10.12.124:9100
          - 10.10.12.126:9100
          - 10.10.12.127:9100
          - 10.10.12.128:9100
          - 10.10.12.129:9100
          - 10.10.12.130:9100
          - 10.10.12.131:9100
          - 10.10.12.132:9100

  - job_name: doris-fe
    metrics_path: /metrics
    static_configs:
      - targets: ['10.10.12.126:8030']

  - job_name: doris-be
    metrics_path: /metrics
    static_configs:
      - targets:
          - 10.10.12.127:8040
          - 10.10.12.128:8040
          - 10.10.12.129:8040
