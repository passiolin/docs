# 场景: nginx stream 代理 MQTT,单机百万级长连接
# 主机层通用基线(文件描述符三层限制、conntrack、过时参数)见文档:
#   ../linux/2.内核参数与百万连接.md
# 生效: install -m644 99-nginx-mqtt.conf /etc/sysctl.d/ && sysctl --system

# accept / 建连队列
net.core.somaxconn = 65535
net.ipv4.tcp_max_syn_backlog = 262144
net.core.netdev_max_backlog = 262144

# 客户端角色源端口;单 IP 对单个目的 IP:端口默认只有 2.8 万
net.ipv4.ip_local_port_range = 1024 65535
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 15

# 主动关闭侧的 TIME_WAIT / 孤儿连接额度
net.ipv4.tcp_max_tw_buckets = 2000000
net.ipv4.tcp_max_orphans = 1048576

# socket 缓冲:空闲 MQTT 连接用小缓冲,上限 4M 兜底
net.ipv4.tcp_rmem = 4096 16384 4194304
net.ipv4.tcp_wmem = 4096 16384 4194304
net.core.rmem_max = 4194304
net.core.wmem_max = 4194304
net.core.optmem_max = 65536

# 单位是页(×4KB):4G / 8G / 16G 水位;默认值按小内存机给,百万 socket 会先撞它
net.ipv4.tcp_mem = 1048576 2097152 4194304

# 长空闲后不重置拥塞窗口
net.ipv4.tcp_slow_start_after_idle = 0

vm.swappiness = 0
