# nginx stream 代理 MQTT:百万级长连接配置模板
# 场景:client -> nginx:1883 -> broker:1883,纯 TCP 转发,无 TLS 终结
# 依赖:Ubuntu 26.04 + nginx 1.28 + libnginx-mod-stream(动态模块)

user www-data;
worker_processes auto;
worker_rlimit_nofile 4194304;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

include /etc/nginx/modules-enabled/*.conf;

events {
    # 每 worker 的连接上限;stream 里客户端连接与上游连接都计数
    # 80 万客户端 = 160 万 socket,8 worker 各 20 万,留一倍余量
    worker_connections 524288;
    multi_accept on;
}

stream {
    # 单源 IP 对单个 broker IP:1883 只有约 6.4 万源端口。
    # 32 个源地址按 (客户端 IP:端口) 哈希均分;150 万 / 32 ≈ 4.7 万,仍在端口上限内。
    # 百分比最多两位小数,3.125% 会被 nginx 拒绝。
    split_clients "${remote_addr}:${remote_port}" $src_addr {
        3.12% 10.10.12.21;
        3.12% 10.10.12.22;
        3.12% 10.10.12.23;
        3.12% 10.10.12.24;
        3.12% 10.10.12.25;
        3.12% 10.10.12.26;
        3.12% 10.10.12.27;
        3.12% 10.10.12.28;
        3.12% 10.10.12.29;
        3.12% 10.10.12.30;
        3.12% 10.10.12.31;
        3.12% 10.10.12.32;
        3.12% 10.10.12.33;
        3.12% 10.10.12.34;
        3.12% 10.10.12.35;
        3.12% 10.10.12.36;
        3.12% 10.10.12.37;
        3.12% 10.10.12.38;
        3.12% 10.10.12.39;
        3.12% 10.10.12.40;
        3.12% 10.10.12.41;
        3.12% 10.10.12.42;
        3.12% 10.10.12.43;
        3.12% 10.10.12.44;
        3.12% 10.10.12.45;
        3.12% 10.10.12.46;
        3.12% 10.10.12.47;
        3.12% 10.10.12.48;
        3.12% 10.10.12.49;
        3.12% 10.10.12.50;
        3.12% 10.10.12.51;
        *     10.10.12.52;
    }

    upstream jmqtt {
        server 10.10.12.202:1883;
    }

    server {
        # backlog 受 net.core.somaxconn 约束,两边一起抬
        listen 1883 backlog=65535 reuseport;

        # 按 split_clients 的结果绑定上游源地址
        proxy_bind $src_addr;

        proxy_connect_timeout 5s;

        # 必须大于 MQTT keepalive 的 1.5 倍;keepalive 300 时 broker 450s 判死
        proxy_timeout 30m;

        # 默认 16k,每个会话两个方向各一个;MQTT 报文小,2k 足够
        proxy_buffer_size 2k;

        proxy_socket_keepalive on;

        # 百万连接下访问日志本身是负担
        access_log off;

        proxy_pass jmqtt;
    }
}
