setup.kibana:
  host: "localhost:5601"


setup.ilm.enabled: false
output.elasticsearch:
  enabled: true
  hosts: ["10.40.0.155:9200"]
  username: elastic
  password: xxxx
  indices:
    - index: "cloud-mqtt-%{+yyyy.MM.dd}"  
      when.contains:
        type: "cloud-mqtt"
    - index: "cloud-gateway-%{+yyyy.MM.dd}"
      when.contains:
        type: "cloud-gateway"
    - index: "cloud-device-%{+yyyy.MM.dd}"
      when.contains:
        type: "cloud-device"
    - index: "cloud-infrastructure-%{+yyyy.MM.dd}"
      when.contains:
        type: "cloud-infrastructure"
    - index: "cloud-admin-%{+yyyy.MM.dd}"
      when.contains:
        type: "cloud-admin"
    - index: "cloud-member-%{+yyyy.MM.dd}"
      when.contains:
        type: "cloud-member"
    - index: "cloud-sequence-%{+yyyy.MM.dd}"
      when.contains:
        type: "cloud-sequence"
    - index: "cloud-data-%{+yyyy.MM.dd}"
      when.contains:
        type: "cloud-data"
    - index: "cloud-mall-%{+yyyy.MM.dd}"
      when.contains:
        type: "cloud-mall"        
    - index: "cloud-auth-%{+yyyy.MM.dd}"
      when.contains:
        type: "cloud-auth" 
    - index: "cloud-smarthome-%{+yyyy.MM.dd}"
      when.contains:
        type: "cloud-smarthome"                
processors:
- drop_fields:
     fields: ["agent.type","agent.name", "agent.version","log.file.path","log.offset","input.type","ecs.version","host.name","agent.ephemeral_id","agent.hostname","agent.id","_id","_index","_score","_suricata.eve.timestamp","agent.hostname","cloud. availability_zone","host.containerized","host.os.kernel","host.os.name","host.os.version"]


