filebeat.inputs:
- type: log
  enabled: true
  paths:
    - /data/cloud/cloud-gateway-*/logs/*.log
  fields:
    type: "cloud-gateway"
  fields_under_root: true
  encoding: utf-8
  multiline.pattern: ^[0-9]{4}\-[0-9]{2}\-[0-9]{2}
  multiline.negate: true
  multiline.match: after
