# ============================================================
# zoo.cfg —— ZooKeeper 3.9 集群基线(实测 3.9.5)
# 三台一致;节点差异 = ZOO_MY_ID 环境变量(docker run 注入)
# 挂载到容器 /conf/zoo.cfg
# ============================================================

# ---------- 基础节拍(定一次) ----------
tickTime=2000
# follower 启动时同步 leader 的容忍(initLimit×tickTime)
initLimit=10
# 请求应答超时(syncLimit×tickTime)
syncLimit=5

# ---------- 目录(容器内路径,与 -v 挂载对应) ----------
dataDir=/data
dataLogDir=/datalog
clientPort=2181

# ---------- 集群拓扑(server.N 三台一致;N 与各节点 ZOO_MY_ID 对应) ----------
server.1=10.10.12.131:2888:3888
server.2=10.10.12.132:2888:3888
server.3=10.10.12.133:2888:3888
# 2888 = follower 连 leader;3888 = 选举端口

# ---------- 四字命令白名单(巡检 Z01/Z02 依赖;官方镜像默认只放行 srvr) ----------
4lw.commands.whitelist=ruok,mntr,srvr,stat,conf,isro,envi

# ---------- 自动清理快照与事务日志(磁盘拍板:防 dataDir 无限膨胀) ----------
autopurge.snapRetainCount=3
autopurge.purgeInterval=24

# ---------- 连接配额(业务拍板) ----------
maxClientCnxns=60
