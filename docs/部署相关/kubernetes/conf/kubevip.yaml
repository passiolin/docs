# /var/lib/rancher/rke2/agent/pod-manifests/kube-vip.yaml —— 三台 server 各放一份
# 注意:静态 Pod 目录是 agent/pod-manifests;server/manifests 是 rke2 deploy controller 的
# Helm chart 目录,放那里会变成被调度的普通 Pod,HA 无效(2026-10-10 实测踩坑)
# 本清单由 kube-vip v1.2.4 官方镜像生成后按 RKE2 修正两处:
#   1. hostPath /etc/kubernetes/admin.conf(kubeadm 路径)→ /etc/rancher/rke2/rke2.yaml
#   2. 补 vip_subnet 环境变量(v1.x 用 vip_address 时必须,否则 CrashLoop)
apiVersion: v1
kind: Pod
metadata:
  name: kube-vip
  namespace: kube-system
spec:
  containers:
  - args:
    - manager
    env:
    - name: vip_arp
      value: "true"
    - name: port
      value: "6443"
    - name: vip_nodename
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
    - name: vip_interface
      value: ens18                  # 用 ip -br a 确认网卡名
    - name: dns_mode
      value: first
    - name: dhcp_mode
      value: ipv4
    - name: cp_enable
      value: "true"
    - name: cp_namespace
      value: kube-system
    - name: vip_leaderelection
      value: "true"
    - name: vip_leasename
      value: plndr-cp-lock
    - name: vip_leaseduration
      value: "15"
    - name: vip_renewdeadline
      value: "10"
    - name: vip_retryperiod
      value: "2"
    - name: vip_address
      value: 10.10.12.140
    - name: vip_subnet
      value: "32"
    - name: prometheus_server
      value: :2112
    image: ghcr.io/kube-vip/kube-vip:v1.2.4
    imagePullPolicy: IfNotPresent
    name: kube-vip
    resources: {}
    securityContext:
      capabilities:
        add:
        - NET_ADMIN
        - NET_RAW
        drop:
        - ALL
    volumeMounts:
    - mountPath: /etc/kubernetes/admin.conf
      name: kubeconfig
  hostAliases:
  - hostnames:
    - kubernetes
    ip: 127.0.0.1
  hostNetwork: true
  volumes:
  - hostPath:
      path: /etc/rancher/rke2/rke2.yaml
    name: kubeconfig
status: {}
