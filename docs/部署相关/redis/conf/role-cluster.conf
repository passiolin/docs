# ============================================================
# role-cluster.conf —— Cluster 角色增量(实测 Redis 8.0.x)
# 与 common.conf 拼接生效;cluster 端口与 announce-ip 由 gen 注入
# 生产集群至少 3 主 3 从(6 节点);hash 槽 16384 由集群自动分配
# ============================================================

cluster-enabled yes

# 节点状态文件(每实例独立,存数据目录)
cluster-config-file nodes.conf

# 节点间心跳超时:超时被认为 fail,触发主从切换
cluster-node-timeout 15000

# 副本迁移:孤立主节点的从库会迁移到无从的主(小集群建议关)
cluster-allow-replica-migration no

# 从库是否禁止发起故障转移(no=允许故障转移时被提升)
cluster-replica-no-failover no

# docker --net=host 下必须显式通告本机地址与总线端口,否则节点互相发现的是错误地址
# 以下两项由 gen-node-conf.sh 注入:
# cluster-announce-ip <本机IP>
# cluster-announce-port <实例端口>
# cluster-announce-bus-port <实例端口+10000>
