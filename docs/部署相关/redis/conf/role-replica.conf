# ============================================================
# role-replica.conf —— 从库角色增量(实测 Redis 8.0.x)
# 与 common.conf 拼接生效;replicaof 由 gen-node-conf.sh 注入
# ============================================================
# 以下是占位说明,实际 replicaof 行由脚本生成:
# replicaof <主库IP> 6379

# 从库只读(默认 yes,显式声明便于审计)
replica-read-only yes

# 从库优先级:哨兵选主依据,0 表示永不晋升为主
# (纯副本/异地容灾节点设 0;三节点对等部署保持默认 100,由 gen 注入)
replica-priority 100
