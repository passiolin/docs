# ============================================================
# role-sentinel.conf —— 哨兵配置(实测 Redis 8.0.x)
# 注意:哨兵是独立进程(redis-sentinel),不是 redis-server 的角色;
# 容器内用同一镜像跑:docker run ... redis:8.0 redis-sentinel /conf/sentinel.conf
# 三台各一个哨兵;mymaster 指向主库,<主库IP> 由 gen-node-conf.sh 注入
# ============================================================
port 26379

# 监控名 mymaster:主库 地址 端口 法定人数(3 节点哨兵取 2)
sentinel monitor mymaster <主库IP> 6379 2

# 主库密码(哨兵连主、连从、故障迁移后连新主都用它)
sentinel auth-pass mymaster Redis@2026

# 主观下线判定:默认 30s,内网建议收紧
sentinel down-after-milliseconds mymaster 5000

# 故障迁移时同时向新主同步的从库数(小集群 1,保住一个在线副本)
sentinel parallel-syncs mymaster 1

# 故障迁移超时
sentinel failover-timeout mymaster 60000

# 哨兵自身 announce(announce-ip 由 gen 注入;--net=host 下容器继承宿主 IP)
# sentinel announce-ip <本机IP>
sentinel announce-port 26379

# 容器内后台写 sentinel monitors 运行态时会改写本文件,docker 下挂载副本可写
dir /data
