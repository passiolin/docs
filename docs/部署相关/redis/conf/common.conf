# ============================================================
# common.conf —— 所有角色共享的参数基线(Redis 8.0,实测 8.0.x)
# 由 gen-node-conf.sh 与角色增量拼接成节点最终配置;
# 内存参照:专机 4G 容器/虚机,换机器按第 2 篇公式重算
# 变更纪律:改这里 → 重启/CONFIG RELOAD 语义见第 2 篇 → 巡检对照查漂移
# ============================================================

# ---------- 一、内存(硬件/业务拍板) ----------
# 上限必须设(默认 0=不限,巡检 R02 直接记 P2);
# 专机给物理内存 50%~70%,给 fork(COW)/副本同步留余量
maxmemory 2gb
# 淘汰策略按业务语义:缓存选 allkeys-lru;混存选 volatile-lru + 过期时间;
# 当"存储"用选 noeviction(写满报错优于静默丢数据)
maxmemory-policy allkeys-lru

# ---------- 二、持久化(数据等级拍板) ----------
# 数据目录(容器内路径,与 -v /data/redis/data:/data 对应)
dir /data
# 基线:RDB + AOF 双开(AOF 每秒 fsync,最多丢 1 秒;RDB 便于备份/重启用)
save 3600 1 300 100 60 10000
appendonly yes
appendfsync everysec
# AOF 重写期间是否暂停 fsync:不暂停,容忍少量 OS 缺页
no-appendfsync-on-rewrite no
# 混合持久化(AOF 前导用 RDB 二进制,7.0+ 默认开,重写更快恢复更快)
aof-use-rdb-preamble yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# ---------- 三、网络与连接(业务拍板) ----------
maxclients 10000
tcp-backlog 511
timeout 0
tcp-keepalive 300
# docker --net=host 下绑所有地址,靠 protected-mode + 密码兜底
bind 0.0.0.0
protected-mode yes

# ---------- 四、复制(架构拍板,replicaof 由角色文件注入) ----------
# 主从同密码:masterauth 供从库/哨兵连主,复制断开自动重连
masterauth Redis@2026
replica-serve-stale-data yes
# 复制积压:写并发高/网络抖动场景加大,避免全量重同步
repl-backlog-size 64mb
repl-diskless-sync yes

# ---------- 五、安全(合规) ----------
requirepass Redis@2026
# 危险命令处置(FLUSHALL/CONFIG/KEYS 等)走 ACL,见第 3 篇

# ---------- 六、可观测 ----------
slowlog-log-slower-than 10000
slowlog-max-len 256
latency-monitor-threshold 100
loglevel notice
# docker 下日志走 stdout(docker logs)
logfile ""
