# ============================================================
# role-sentinel.conf —— 哨兵配置(实测 Valkey 8.1.12)
# 哨兵是独立进程 valkey-sentinel,不是 valkey-server 的角色;同一镜像跑:
#   docker run -d --net=host -v /data/valkey-ha/26379:/data \
#     valkey/valkey:8.1 valkey-sentinel /data/sentinel.conf
# 注意:镜像 entrypoint 只对 valkey-server 做 chown+降权,valkey-sentinel 以 root 跑;
# 介意就 --user 999 显式指定并自行保证目录可写(第 4 篇实测)
# mymaster 指向主库,<主库IP> 由部署注入;三台各一个哨兵
# ============================================================
port 26379

# 监控名 mymaster:主库 地址 端口 法定人数(3 节点哨兵取 2)
sentinel monitor mymaster <主库IP> 6379 2

# 主库密码(哨兵连主、连从、切换后连新主都用它)
sentinel auth-pass mymaster Valkey@2026

# 主观下线判定:默认 30s,内网收紧到 5s(实测停库→切主 7.8s)
sentinel down-after-milliseconds mymaster 5000

# 故障切换时同时向新主同步的从库数(小集群 1,保住一个在线副本)
sentinel parallel-syncs mymaster 1

# 故障切换超时
sentinel failover-timeout mymaster 60000

# 哨兵自身 announce(announce-ip 由部署注入;--net=host 下容器继承宿主 IP)
# sentinel announce-ip <本机IP>
sentinel announce-port 26379

# 哨兵运行态会改写本文件,挂载目录必须可写
dir /data
