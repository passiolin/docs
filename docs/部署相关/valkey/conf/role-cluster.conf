# ============================================================
# role-cluster.conf —— Cluster 角色增量(实测 Valkey 8.1.12)
# 与 common.conf 拼接生效;生产集群至少 3 主 3 从(6 节点),hash 槽 16384 由集群自动分配
# 注入方式与 redis 侧一致(见 ../redis/conf/gen-node-conf.sh 的 cluster 分支):
#   port <实例端口>
#   cluster-announce-ip <本机IP>
#   cluster-announce-port <实例端口>
#   cluster-announce-bus-port <实例端口+10000>
# ============================================================

cluster-enabled yes

# 节点状态文件(每实例独立数据目录,重名不冲突)
cluster-config-file nodes.conf

# 节点间心跳超时:超时被标记 fail 触发切换(实测 15s:判死+选举共 20s 恢复写)
cluster-node-timeout 15000

# 副本迁移:孤立主节点的从库会迁移到无从的主(小集群建议关)
cluster-allow-replica-migration no

# 从库是否禁止发起故障转移(no=允许故障转移时被提升)
cluster-replica-no-failover no

# docker --net=host 下必须显式通告本机地址与总线端口,否则节点互相发现的是错误地址
# 以下三项由部署注入:
# cluster-announce-ip <本机IP>
# cluster-announce-port <实例端口>
# cluster-announce-bus-port <实例端口+10000>
